[project]
name = "cil-depth"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "numpy>=1.24.0",
    "pillow>=9.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "kagglehub>=0.3.0",
    "kaggle>=1.8.0",
    "pandas>=2.0.0",
    "ipykernel>=6.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "platform_system == 'Linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
