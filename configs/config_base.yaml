model:
  encoder_size: base          # 'small' (384-dim) or 'base' (768-dim)
  encoder_pretrained: true
  decoder_type: transformer
  decoder_blocks: 5
  img_size: 560
  patch_size: 16
  output_size: null

data:
  data_root: data/
  train_image_dir: train
  train_depth_dir: train
  test_image_dir: test
  num_workers: 3
  val_split: 0.1

training:
  epochs: 50
  batch_size: 4               # base is 2x wider + 1225 tokens
  lr: 1.0e-4
  freeze_encoder: true
  weight_decay: 0.01
  grad_clip: 1.0
  amp: true
  seed: 42

logging:
  log_interval: 20
  checkpoint_dir: checkpoints/
  experiment_name: vit_depth
